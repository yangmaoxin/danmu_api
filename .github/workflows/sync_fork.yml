name: Fork Sync

permissions:
    contents: write

on:
    schedule:
        - cron: "0 0 * * *"  # 每天午夜执行
    workflow_dispatch:  # 允许手动触发

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest
        if: ${{ github.event.repository.fork }}

        steps:
            - name: Checkout target repo
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  fetch-depth: 0

            - name: Sync upstream except GitHub workflows
              run: |
                  git remote add upstream https://github.com/huangxd-/danmu_api.git
                  git fetch upstream main
                  git diff --binary HEAD upstream/main -- . ':(exclude).github/workflows' | git apply --index --binary

                  if git diff --cached --quiet; then
                    echo "Already up to date, excluding .github/workflows."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git commit -m "chore: sync upstream excluding GitHub workflows"
                  git push origin HEAD:main
